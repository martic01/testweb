<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/69e6ea6e14.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>page</title>
</head>

<body>
    <div class="topbox">

        <div class="intop">
            <i class="fa-brands fa-square-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-twitter"></i>
            <p>#NailedAtTheBoutique</p>
        </div>

        <div class="intop right">
            <i class="fa-solid fa-basket-shopping"></i>
            <i class="fa-solid fa-user"></i>
        </div>
    </div>

    <div class="navbar">
        <div class="innav">
            <img src="img/logo-white.png" alt="">
            <ul>
                <li>Home</li>
                <li>About Us <span class="sp">&gt;</span></li>
                <li> Gallery</li>
                <li> Services</li>
                <li> Special Offers</li>
                <li> Shop</li>
                <li>Contact Us</li>
                <li>Privacy Policy</li>
            </ul>
        </div>
        <button>
            <p>BOOK MY APPOINTMENT &rarr;</p>
        </button>
    </div>
    <div class="bigimg">
        <div class="dim">
            <div class="txt">
                <p class="p1">Discover</p>
                <p class="p2">THE COLLECTION</p>
                <p class="p3">Our array of colors and products</p>
                <a href="#"> 
                    <button>
                        <p>Shop now &rarr;</p>
                    </button>
                </a>
            </div>
        </div>
    </div>

</body>

</html>
